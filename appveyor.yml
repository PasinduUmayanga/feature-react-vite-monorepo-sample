version: 1.0.{build}

image: Visual Studio 2022

environment:
  nodejs_version: "22"

init:
  - git config --global core.autocrlf input

cache:
  - webclient/.pnpm-store -> webclient/pnpm-lock.yaml

install:
  - ps: Install-Product node $env:nodejs_version x64
  - corepack enable
  - ps: Set-Location webclient; pnpm install --frozen-lockfile --store-dir .pnpm-store

build_script:
  - ps: Set-Location webclient; pnpm typecheck
  - ps: Set-Location webclient; pnpm build

test: off

artifacts:
  - path: webclient/apps/web/dist
    name: web
    type: zip
  - path: webclient/apps/admin/dist
    name: admin
    type: zip
