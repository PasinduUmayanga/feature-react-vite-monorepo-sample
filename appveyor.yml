version: 1.0.{build}

image: Visual Studio 2022

environment:
  nodejs_version: "24.19.0"

init:
  - git config --global core.autocrlf input

cache:
  - webclient/.pnpm-store -> webclient/pnpm-lock.yaml

install:
  - ps: Update-NodeJsInstallation $env:nodejs_version x64
  - npm install --global pnpm@10.15.0
  - cmd: cd /d "%APPVEYOR_BUILD_FOLDER%\webclient" && pnpm install --frozen-lockfile --store-dir .pnpm-store

build_script:
  - cmd: cd /d "%APPVEYOR_BUILD_FOLDER%\webclient" && pnpm lint
  - cmd: cd /d "%APPVEYOR_BUILD_FOLDER%\webclient" && pnpm typecheck
  - cmd: cd /d "%APPVEYOR_BUILD_FOLDER%\webclient" && pnpm build

test: off

artifacts:
  - path: webclient/apps/web/dist
    name: web
    type: zip
  - path: webclient/apps/admin/dist
    name: admin
    type: zip
